<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub API</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white text-center p-4">
        <h1>Week 6 Laboratory</h1>
        <p class="mb-0">Client-Side Storage & API Integration</p>
    </header>


    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Week 6 Lab
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">
                            Local Storage
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="user_preferences.html">
                            User Preferences
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="weather_api.html">
                            Weather
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="map_api.html">
                            Maps
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="github_api.html">
                            GitHub
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">
                        🐙 GitHub User Lookup
                    </h2>

                    <div class="input-group mb-3">

                        <input type="text"
                               id="username"
                               class="form-control"
                               placeholder="Enter GitHub Username">

                        <button class="btn btn-dark"
                                onclick="getUser()">
                            Get User
                        </button>

                    </div>


                    <!-- GitHub User Result -->
                    <div id="userResult"
                         class="text-center mt-4">
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0"> Elyza Marie D. Boro | BSIS 2A</p>
    </footer>


    <!-- GitHub API JavaScript -->
    <script>

        function getUser() {

            let username =
                document.getElementById("username").value;

            let url =
                `https://api.github.com/users/${username}`;

            fetch(url)

                .then(response => response.json())

                .then(data => {

                    document.getElementById("userResult").innerHTML = `

                        <h3>${data.name || "No Name Found"}</h3>

                        <img
                            src="${data.avatar_url}"
                            width="100"
                            height="100"
                            class="rounded-circle mb-3"
                            alt="GitHub Avatar"
                        >

                        <p>
                            <strong>Public Repositories:</strong>
                            ${data.public_repos}
                        </p>

                        <p>
                            <strong>Followers:</strong>
                            ${data.followers}
                        </p>

                    `;

                })

                .catch(error => {

                    document.getElementById("userResult").innerHTML =
                        "<p class='text-danger'>Error fetching GitHub data.</p>";

                    console.error(
                        "Error fetching GitHub data:",
                        error
                    );

                });

        }

    </script>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
