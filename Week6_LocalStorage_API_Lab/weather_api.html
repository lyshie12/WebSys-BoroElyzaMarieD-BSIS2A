<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Weather API</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <header class="bg-primary text-white text-center p-4">
        <h1>Week 6 Laboratory</h1>
        <p class="mb-0">Client-Side Storage & API Integration</p>
    </header>


    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Week 6 Lab
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="local_storage.html">
                            Local Storage
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="user_preferences.html">
                            User Preferences
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="weather_api.html">
                            Weather
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="map_api.html">
                            Maps
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="github_api.html">
                            GitHub
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">
                        🌤️ Weather Checker
                    </h2>

                    <div class="input-group mb-3">

                        <input type="text"
                               id="city"
                               class="form-control"
                               placeholder="Enter city name">

                        <button class="btn btn-primary"
                                onclick="getWeather()">
                            Get Weather
                        </button>

                    </div>


                    <!-- Weather Result -->
                    <div id="weatherResult"
                         class="text-center mt-4">
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0"> Elyza Marie D. Boro | BSIS 2A</p>
    </footer>


    <!-- Weather API JavaScript -->
    <script>

        function getWeather() {

            let city = document.getElementById("city").value;

            let apiKey = "7b2d4932331ab5dee52391075d5e0450";

            let url =
                `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            fetch(url)

                .then(response => response.json())

                .then(data => {

                    document.getElementById("weatherResult").innerHTML = `

                        <h3>${data.name}</h3>

                        <img
                            src="https://openweathermap.org/img/w/${data.weather[0].icon}.png"
                            alt="Weather icon"
                        >

                        <h4>${data.main.temp}°C</h4>

                        <p class="text-capitalize">
                            ${data.weather[0].description}
                        </p>

                    `;

                })

                .catch(error => {

                    document.getElementById("weatherResult").innerHTML =
                        "<p class='text-danger'>Error fetching weather data.</p>";

                    console.error("Error fetching weather data:", error);

                });

        }

    </script>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
